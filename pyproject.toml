[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-cortex"
version = "0.1.0"
description = "Company brain over the rust-lang/rfcs corpus — claim-level-cited answers on FalkorDB"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic>=2",
    "uvicorn",
    "graphrag-sdk==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# The local HHEM-2.1-Open cross-encoder behind POST /faithfulness. Not a dev
# dependency on purpose: automated CI installs only [dev] and never downloads
# torch or the model (zero-LLM-call rule). The api image installs this extra.
faithfulness = [
    "torch>=2.2",
    "transformers>=4.44",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a running FalkorDB (deselected in offline CI)",
    "live: requires the real OpenRouter API (deselected in offline CI)",
]
