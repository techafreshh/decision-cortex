# Compose smoke — the judge's first experience, machine-checked.
# Activates when W4 lands infra/ (docker-compose.yml + Caddyfile).
# Deliberately does NOT trigger on its own workflow file (nothing to boot yet).
name: compose-smoke

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'snapshot/**'
      - 'api/**'
      - 'web/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'infra/**'
      - 'snapshot/**'
      - 'api/**'
      - 'web/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: compose up -> healthz -> seeded graph
    runs-on: ubuntu-latest
    # Generous: the api image installs graphrag-sdk (-> torch) and compiles
    # hnswlib, then the first boot seeds the 28k-node snapshot.
    timeout-minutes: 30
    env:
      SMOKE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - name: Guard (infra not scaffolded yet)
        id: guard
        run: |
          if [ ! -f infra/docker-compose.yml ]; then
            echo '::notice::infra/ not scaffolded yet — nothing to smoke'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Boot the stack
        if: steps.guard.outputs.ready == 'true'
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for healthz + seeded graph
        if: steps.guard.outputs.ready == 'true'
        run: |
          for i in $(seq 1 60); do
            body="$(curl -fsS "${SMOKE_URL}/healthz" 2>/dev/null || true)"
            if [ -n "$body" ] && \
              python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("seeded") is True else 1)' <<<"$body"; then
              echo "healthz reports a seeded graph after attempt $i: $body"
              # Caddy serves the built SPA, not just the API.
              curl -fsS "${SMOKE_URL}/" | grep -q '<div id="root">'
              # Caddy proxies an API-only route: an unknown node id returns the
              # API's JSON 404, while the SPA catch-all would return 200 HTML.
              code="$(curl -s -o /dev/null -w '%{http_code}' "${SMOKE_URL}/node/__probe__")"
              if [ "$code" != "404" ]; then
                echo "Caddy did not proxy /node/* to the API (got HTTP $code)"
                docker compose -f infra/docker-compose.yml logs --no-color
                exit 1
              fi
              exit 0
            fi
            sleep 5
          done
          echo "healthz never reported a seeded graph"
          docker compose -f infra/docker-compose.yml logs --no-color
          exit 1
      - name: Second boot reuses the volume (seed guard path)
        if: steps.guard.outputs.ready == 'true'
        run: |
          docker compose -f infra/docker-compose.yml restart api
          for i in $(seq 1 60); do
            body="$(curl -fsS "${SMOKE_URL}/healthz" 2>/dev/null || true)"
            if [ -n "$body" ] && \
              python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("seeded") is True else 1)' <<<"$body"; then
              echo "api back up with a seeded graph after restart attempt $i"
              break
            fi
            sleep 5
          done
          docker compose -f infra/docker-compose.yml logs --no-color api > /tmp/api.log
          cat /tmp/api.log
          # The guard, not a re-ingest: proves acceptance criterion 5.
          grep -q "graph already seeded" /tmp/api.log
      - name: Cleanup
        if: always() && steps.guard.outputs.ready == 'true'
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans
