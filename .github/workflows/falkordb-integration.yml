# FalkorDB integration tests.
# Activates with Phase-1 code (PRD §12): loads a fixture snapshot into a real
# FalkorDB service container, runs the reference Cypher queries, and asserts
# idempotency (ingest twice -> node/edge counts unchanged). Still zero LLM
# calls; OPENROUTER_API_KEY is hard-emptied here too.
name: falkordb-integration

on:
  push:
    branches: [main]
    paths:
      - 'ingest/**'
      - 'api/**'
      - 'verification/**'
      - '.github/workflows/falkordb-integration.yml'
  pull_request:
    paths:
      - 'ingest/**'
      - 'api/**'
      - 'verification/**'
      - '.github/workflows/falkordb-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falkordb-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: pytest -m integration (real FalkorDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      falkordb:
        # TODO(W1, Phase 1): pin an exact 6.x tag once we know the
        # docker-hub tags at build time; `latest` keeps this bootable now.
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: '6379'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -U pip
          pip install pytest ruff
          pip install -e '.[dev]' || pip install -r requirements.txt || true
      - name: Wait for FalkorDB
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null; then
              exec 3>&-
              echo "FalkorDB is up after attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "FalkorDB did not come up in time"
          exit 1
      - name: Integration tests (no LLM)
        env:
          OPENROUTER_API_KEY: ''
        run: |
          status=0
          pytest -q -m 'integration' || status=$?
          if [ "$status" -eq 5 ]; then
            echo '::notice::no integration tests collected yet (Phase 1 not started)'
            exit 0
          fi
          exit "$status"
