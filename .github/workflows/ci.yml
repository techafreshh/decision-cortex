# CI — lint + unit.
# Legal pre-event (prep line): nothing here writes schema/queries into
# FalkorDB and there are ZERO LLM calls — OPENROUTER_API_KEY is hard-emptied
# so any test needing the real API fails fast unless marked `live`.
# Note: hashFiles() is only legal at step level (GitHub actions quirk), so
# per-stack enablement lives in step guards, not job-level `if`s.
name: ci (lint + unit)

on:
  push:
    branches: [main]
    paths:
      - 'ingest/**'
      - 'snapshot/**'
      - 'api/**'
      - 'verification/**'
      - 'web/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'ingest/**'
      - 'snapshot/**'
      - 'api/**'
      - 'verification/**'
      - 'web/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + unit (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Skip notice (no python project yet)
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') == '' }}
        run: echo '::notice::no python project yet (scaffold pending) — lint+unit skipped'
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
        with:
          python-version: '3.12'
          cache: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' && 'pip' || '' }}
      - name: Install
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
        run: |
          python -m pip install -U pip
          pip install ruff pytest
          pip install -e '.[dev]' || pip install -r requirements.txt || true
      - name: Ruff (lint)
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
        run: ruff check --output-format=github .
      - name: Unit tests (offline only)
        if: ${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') != '' }}
        env:
          OPENROUTER_API_KEY: ''
        run: |
          status=0
          pytest -q -m 'not integration and not live' || status=$?
          if [ "$status" -eq 5 ]; then
            echo '::notice::no unit tests collected yet (pre-scaffold)'
            exit 0
          fi
          exit "$status"

  web:
    name: lint + build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Skip notice (no web app yet)
        if: ${{ hashFiles('web/package.json') == '' }}
        run: echo '::notice::no web app yet (scaffold pending) — build skipped'
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('web/package.json') != '' }}
        with:
          node-version: '22'
          cache: ${{ hashFiles('web/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Build static bundle
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: |
          npm ci
          npm run lint --if-present
          npm run build
